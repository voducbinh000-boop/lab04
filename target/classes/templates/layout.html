<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Hệ Thống Quản Lý</title>
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
	<nav class="navbar px-3 py-2" style="background-color: #ffc828;">
		<div class="container-fluid">
			<div class="d-flex gap-2">
				<a th:href="@{/categories}" class="btn btn-danger fw-bold">Quản Lý Danh Mục</a>
				<a th:href="@{/products}" class="btn btn-danger fw-bold">Quản Lý Sản Phẩm</a>
			</div>
			<div class="d-flex gap-2">
				<a th:href="@{/categories/add}" class="btn btn-danger btn-sm">+ Thêm Danh Mục</a>
				<a th:href="@{/products/add}" class="btn btn-danger btn-sm">+ Thêm Sản Phẩm</a>
			</div>
		</div>
	</nav>

	<main class="container my-4" style="max-width: 900px;">
		<div class="card shadow-sm">
			<div class="card-body">
				<div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
				<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

				<section layout:fragment="content"></section>
			</div>
		</div>
	</main>
</body>
</html>
