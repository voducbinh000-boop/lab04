<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title>Cập Nhật Sản Phẩm</title>
</head>
<body>
	<section layout:fragment="content">
		<h1>Cập Nhật Sản Phẩm</h1>
		<form th:action="@{/products/update/{id}(id=${product.id})}" th:object="${product}" method="post">
			<div class="mb-3">
				<label for="name" class="form-label">Tên sản phẩm:</label>
				<input type="text" th:field="*{name}" class="form-control" id="name" required>
				<div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
			</div>
			<div class="mb-3">
				<label for="price" class="form-label">Giá cả:</label>
				<input type="number" step="0.01" min="0" th:field="*{price}" class="form-control" id="price" required>
				<div class="text-danger" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
			</div>
			<div class="mb-3">
				<label for="category" class="form-label">Danh mục:</label>
				<select th:field="*{category.id}" class="form-control" id="category">
					<option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
				</select>
				<div class="text-danger" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
			</div>
			<div class="mb-3">
				<label for="description" class="form-label">Mô tả:</label>
				<textarea th:field="*{description}" class="form-control" id="description" rows="3" required></textarea>
			</div>
			<button type="submit" class="btn btn-primary">Lưu Thay Đổi</button>
			<a th:href="@{/products}" class="btn btn-secondary">Hủy</a>
		</form>
	</section>
</body>
</html>
