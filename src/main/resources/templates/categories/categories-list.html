<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout}">
<head>
<title>Danh Sách Danh Mục</title>
</head>
<body>
	<section layout:fragment="content">
		<h1>Danh Sách Danh Mục</h1>
		<div class="mb-3">
			<a th:href="@{/categories/add}" class="btn btn-primary">Thêm Danh Mục Mới</a>
		</div>
		<table class="table table-bordered table-hover">
			<thead class="table-dark">
				<tr>
					<th>ID</th>
					<th>Tên Danh Mục</th>
					<th>Hành Động</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="category : ${categories}">
					<td th:text="${category.id}"></td>
					<td th:text="${category.name}"></td>
					<td>
						<a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-success btn-sm">Sửa</a>
						<a th:href="@{/categories/delete/{id}(id=${category.id})}" class="btn btn-danger btn-sm"
							onclick="return confirm('Bạn có chắc chắn muốn xóa không?')">Xóa</a>
					</td>
				</tr>
				<tr th:if="${#lists.isEmpty(categories)}">
					<td colspan="3" class="text-center text-muted">Chưa có danh mục nào.</td>
				</tr>
			</tbody>
		</table>
	</section>
</body>
</html>
